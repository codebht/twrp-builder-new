name: Recovery Build

on:
  workflow_dispatch:
    inputs:

      MANIFEST_URL:
        description: "MANIFEST_URL (for SSH use git@github.com:...)"
        required: true
        default: "https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git"

      MANIFEST_BRANCH:
        description: "MANIFEST_BRANCH"
        required: true
        default: "twrp-9.0"

      DEVICE_TREE_URL:
        description: "DEVICE_TREE_URL"
        required: true
        default: "https://github.com/codebht/twrp_acerone8t482l_a10"

      DEVICE_TREE_BRANCH:
        description: "DEVICE_TREE_BRANCH"
        required: true
        default: "full_tb8766p1_64_bsp-user-10-QP1A.190711.020-1637807355-release-keys"

      DEVICE_PATH:
        description: "DEVICE_PATH"
        required: true
        default: "device/acer/T482L"

      COMMON_TREE_URL:
        description: "COMMON_TREE_URL (leave blank if not needed)"
        required: false
        default: ""

      COMMON_PATH:
        description: "COMMON_PATH (leave blank if not needed)"
        required: false
        default: ""

      DEVICE_NAME:
        description: "DEVICE_NAME"
        required: true
        default: "T482L"

      MAKEFILE_NAME:
        description: "MAKEFILE_NAME"
        required: true
        default: "omni_T482L"

      BUILD_TARGET:
        description: "BUILD_TARGET"
        required: true
        default: "recovery"


jobs:

  build:

    if: github.event.repository.owner.id == github.event.sender.id

    runs-on: ubuntu-22.04

    permissions:
      contents: write

    steps:

      # =========================================================
      # DISPLAY PARAMETERS
      # =========================================================

      - name: Display Run Parameters
        run: |
          echo "::group::Recovery Build Parameters"

          echo "Manifest URL: ${{ github.event.inputs.MANIFEST_URL }}"
          echo "Manifest Branch: ${{ github.event.inputs.MANIFEST_BRANCH }}"

          echo "Device Tree URL: ${{ github.event.inputs.DEVICE_TREE_URL }}"
          echo "Device Tree Branch: ${{ github.event.inputs.DEVICE_TREE_BRANCH }}"

          echo "Device Path: ${{ github.event.inputs.DEVICE_PATH }}"

          echo "Common Tree URL: ${{ github.event.inputs.COMMON_TREE_URL }}"
          echo "Common Path: ${{ github.event.inputs.COMMON_PATH }}"

          echo "Device Name: ${{ github.event.inputs.DEVICE_NAME }}"
          echo "Makefile: ${{ github.event.inputs.MAKEFILE_NAME }}"

          echo "Build Target: ${{ github.event.inputs.BUILD_TARGET }}.img"

          echo "::endgroup::"


      # =========================================================
      # CHECKOUT
      # =========================================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # =========================================================
      # CLEAN RUNNER
      # =========================================================

      - name: Cleanup
        uses: rokibhasansagar/slimhub_actions@main


      # =========================================================
      # BUILD DEPENDENCIES
      # =========================================================

      - name: Prepare Build Environment
        run: |

          set -e

          echo "::group::APT Update"

          sudo apt-get update

          echo "::endgroup::"

          echo "::group::Installing Build Dependencies"

          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y \
            linux-modules-extra-$(uname -r) \
            gperf \
            gcc-multilib \
            g++-multilib \
            libc6-dev \
            lib32ncurses-dev \
            x11proto-core-dev \
            libx11-dev \
            tree \
            lib32z-dev \
            libgl1-mesa-dev \
            libxml2-utils \
            xsltproc \
            bc \
            ccache \
            lib32readline-dev \
            lib32z1-dev \
            liblz4-tool \
            libncurses-dev \
            libsdl1.2-dev \
            build-essential \
            libgtk-3-dev \
            libglu1-mesa-dev \
            freeglut3-dev \
            git \
            curl \
            libxml2 \
            lzop \
            pngcrush \
            schedtool \
            squashfs-tools \
            imagemagick \
            libbz2-dev \
            lzma \
            ncftp \
            qemu-user-static \
            libstdc++-10-dev \
            libncurses6 \
            python3 \
            python3-pip \
            python3-setuptools \
            python3-distutils \
            tar \
            unzip \
            zip \
            rsync \
            libtinfo5

          echo "::endgroup::"

          echo ""
          echo "========== TOOL VERSIONS =========="

          git --version
          python3 --version
          make --version | head -n 1
          gcc --version | head -n 1
          ccache --version | head -n 1

          echo ""
          echo "========== LIBTINFO =========="

          ldconfig -p | grep libtinfo || true

          echo ""
          echo "Environment preparation complete."


      # =========================================================
      # JAVA 8
      # =========================================================

      - name: Install OpenJDK 8
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "8"


      # =========================================================
      # SSH
      # =========================================================

      - name: Setup SSH Keys
        if: |
          startsWith(github.event.inputs.MANIFEST_URL, 'git@github.com') ||
          startsWith(github.event.inputs.DEVICE_TREE_URL, 'git@github.com') ||
          startsWith(github.event.inputs.COMMON_TREE_URL, 'git@github.com')
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: |
            ${{ secrets.SSH_PRIVATE_KEY }}


      # =========================================================
      # INSTALL REPO
      # =========================================================

      - name: Install Repo Tool
        run: |

          set -e

          mkdir -p "$HOME/bin"

          curl -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"

          chmod +x "$HOME/bin/repo"

          sudo ln -sf "$HOME/bin/repo" /usr/local/bin/repo

          echo "Repo version:"
          repo --version


      # =========================================================
      # INITIALIZE SOURCE TREE
      # =========================================================

      - name: Initialize Repo
        id: workspace
        run: |

          set -e

          mkdir -p workspace

          cd workspace

          echo "workspace-folder=$(pwd)" >> "$GITHUB_OUTPUT"

          git config --global user.name "code_bht"
          git config --global user.email "codebht@gmail.com"

          echo ""
          echo "========================================"
          echo "Initializing TWRP source tree"
          echo "========================================"

          repo init \
            --depth=1 \
            -u "${{ github.event.inputs.MANIFEST_URL }}" \
            -b "${{ github.event.inputs.MANIFEST_BRANCH }}"

          echo ""
          echo "Repo initialized successfully."


      # =========================================================
      # SYNC SOURCE
      # =========================================================

      - name: Repo Sync
        run: |

          set -e

          echo ""
          echo "========================================"
          echo "Starting repo sync"
          echo "========================================"

          repo sync \
            -j4 \
            --force-sync \
            --no-clone-bundle \
            --no-tags

          echo ""
          echo "Repo sync complete."

        working-directory: ${{ steps.workspace.outputs.workspace-folder }}


      # =========================================================
      # CLONE DEVICE TREE
      # =========================================================

      - name: Clone Device Tree
        run: |

          set -e

          DEVICE_PATH="${{ github.event.inputs.DEVICE_PATH }}"

          echo "Device path:"
          echo "$DEVICE_PATH"

          mkdir -p "$(dirname "$DEVICE_PATH")"

          git clone \
            --depth=1 \
            -b "${{ github.event.inputs.DEVICE_TREE_BRANCH }}" \
            "${{ github.event.inputs.DEVICE_TREE_URL }}" \
            "$DEVICE_PATH"

          echo ""
          echo "Device tree cloned successfully."

        working-directory: ${{ steps.workspace.outputs.workspace-folder }}


      # =========================================================
      # CLONE COMMON TREE
      # =========================================================

      - name: Clone Common Tree
        if: |
          github.event.inputs.COMMON_TREE_URL != '' &&
          github.event.inputs.COMMON_PATH != ''
        run: |

          set -e

          COMMON_PATH="${{ github.event.inputs.COMMON_PATH }}"

          echo "Common path:"
          echo "$COMMON_PATH"

          mkdir -p "$(dirname "$COMMON_PATH")"

          git clone \
            --depth=1 \
            -b "${{ github.event.inputs.DEVICE_TREE_BRANCH }}" \
            "${{ github.event.inputs.COMMON_TREE_URL }}" \
            "$COMMON_PATH"

          echo ""
          echo "Common tree cloned successfully."

        working-directory: ${{ steps.workspace.outputs.workspace-folder }}


      # =========================================================
      # DETERMINE BUILD TREE
      # =========================================================

      - name: Determine Build Tree
        id: buildtree
        run: |

          set -e

          BRANCH="${{ github.event.inputs.MANIFEST_BRANCH }}"

          if [[ "$BRANCH" == "twrp-11" ||
                "$BRANCH" == "twrp-12.1" ]]; then

            BUILD_TREE="twrp"

          else

            BUILD_TREE="omni"

          fi

          echo "value=$BUILD_TREE" >> "$GITHUB_OUTPUT"

          echo ""
          echo "Build tree: $BUILD_TREE"


      # =========================================================
      # CHECK DEVICE TREE
      # =========================================================

      - name: Check Device Tree
        run: |

          set -e

          DEVICE="${{ github.event.inputs.DEVICE_PATH }}"

          echo ""
          echo "========================================"
          echo "Checking Device Tree"
          echo "========================================"

          echo "Path:"
          echo "$DEVICE"

          if [ ! -d "$DEVICE" ]; then
            echo ""
            echo "ERROR: Device tree directory does not exist."
            exit 1
          fi

          echo ""
          echo "Device tree files:"

          find "$DEVICE" \
            -maxdepth 3 \
            -type f \
            | sort \
            | head -200

          echo ""
          echo "Device tree check passed."

        working-directory: ${{ steps.workspace.outputs.workspace-folder }}


      # =========================================================
      # SYNC DEVICE DEPENDENCIES
      # =========================================================

      - name: Sync Device Dependencies
        run: |

          set -e

          DEVICE="${{ github.event.inputs.DEVICE_PATH }}"
          BUILD_TREE="${{ steps.buildtree.outputs.value }}"

          DEP_FILE="$DEVICE/$BUILD_TREE.dependencies"

          echo ""
          echo "Dependency file:"
          echo "$DEP_FILE"

          if [ -f "$DEP_FILE" ]; then

            echo ""
            echo "Dependency file found."

            if [ -f "${GITHUB_WORKSPACE}/scripts/convert.sh" ]; then

              echo ""
              echo "Running dependency converter..."

              bash "${GITHUB_WORKSPACE}/scripts/convert.sh" "$DEP_FILE"

              echo "Dependency conversion complete."

            else

              echo ""
              echo "No scripts/convert.sh found."
              echo "Skipping conversion."

            fi

            echo ""
            echo "Syncing dependency repositories..."

            repo sync \
              -j4 \
              --force-sync \
              --no-clone-bundle \
              --no-tags

          else

            echo ""
            echo "No dependency file found."
            echo "Skipping dependency sync."

          fi

        working-directory: ${{ steps.workspace.outputs.workspace-folder }}


      # =========================================================
      # FIX LEGACY PYTHON 2 BUILD SCRIPT
      # =========================================================

      - name: Fix Legacy Python Script
        run: |

          set -e

          SCRIPT="build/make/tools/check_radio_versions.py"

          echo ""
          echo "========================================"
          echo "Checking legacy Python build script"
          echo "========================================"

          if [ ! -f "$SCRIPT" ]; then
            echo ""
            echo "ERROR: $SCRIPT not found."
            exit 1
          fi

          echo ""
          echo "Original script:"
          sed -n '1,130p' "$SCRIPT"

          echo ""
          echo "Converting Python 2 syntax to Python 3..."

          python3 - "$SCRIPT" <<'PY'
import sys
from pathlib import Path

path = Path(sys.argv[1])
text = path.read_text()

replacements = {
    'if not bad: print\n':
        'if not bad: print()\n',

    'print "*** Error opening \\"%s.sha1\\"; can\\'t verify %s" % (fn, key)\n':
        'print("*** Error opening \\"%s.sha1\\"; can\\'t verify %s" % (fn, key))\n',

    'print "*** SHA-1 hash of \\"%s\\" doesn\\'t appear in \\"%s.sha1\\"" % (fn, fn)\n':
        'print("*** SHA-1 hash of \\"%s\\" doesn\\'t appear in \\"%s.sha1\\"" % (fn, fn))\n',

    'print "*** \\"%s\\" is version %s; not any %s allowed by \\"%s\\"." % (\n':
        'print("*** \\"%s\\" is version %s; not any %s allowed by \\"%s\\"." % (\n',

    '    fn, versions[digest], key, sys.argv[1])\n':
        '    fn, versions[digest], key, sys.argv[1]))\n',

    'if bad:\n    print\n':
        'if bad:\n    print()\n',
}

for old, new in replacements.items():
    text = text.replace(old, new)

path.write_text(text)
PY

          echo ""
          echo "Running Python 3 syntax check..."

          python3 -m py_compile "$SCRIPT"

          echo ""
          echo "Python 3 syntax check PASSED."

          echo ""
          echo "Patched script:"
          sed -n '45,100p' "$SCRIPT"


      # =========================================================
      # VERIFY PYTHON SCRIPT
      # =========================================================

      - name: Verify Build Script
        run: |

          set -e

          SCRIPT="build/make/tools/check_radio_versions.py"

          echo ""
          echo "Checking:"
          echo "$SCRIPT"

          if ! python3 -m py_compile "$SCRIPT"; then
            echo ""
            echo "ERROR: Python script still contains invalid syntax."
            exit 1
          fi

          echo ""
          echo "Legacy Python compatibility fix is valid."

        working-directory: ${{ steps.workspace.outputs.workspace-folder }}


      # =========================================================
      # SWAP
      # =========================================================

      - name: Set Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12


      # =========================================================
      # CCACHE
      # =========================================================

      - name: Configure CCache
        run: |

          set -e

          echo "Configuring ccache..."

          ccache --max-size=5G

          ccache --set-config=compression=true

          ccache --zero-stats

          echo ""
          echo "CCache configuration:"
          ccache --show-config


      # =========================================================
      # BUILD RECOVERY
      # =========================================================

      - name: Build Recovery
        run: |

          set -e

          echo "::group::Building Recovery"

          echo ""
          echo "========================================"
          echo "Preparing Android build environment"
          echo "========================================"

          source build/envsetup.sh

          export ALLOW_MISSING_DEPENDENCIES=true
          export USE_CCACHE=1

          export CCACHE_EXEC="$(command -v ccache)"

          export JACK_SERVER_VM_ARGUMENTS="-Dfile.encoding=UTF-8"

          echo ""
          echo "CCache:"
          ccache --version

          echo ""
          echo "Lunch target:"
          echo "${{ github.event.inputs.MAKEFILE_NAME }}-eng"

          lunch "${{ github.event.inputs.MAKEFILE_NAME }}-eng"

          echo ""
          echo "========================================"
          echo "Cleaning previous build"
          echo "========================================"

          make clean

          echo ""
          echo "========================================"
          echo "Starting Recovery Build"
          echo "========================================"

          TARGET="${{ github.event.inputs.BUILD_TARGET }}image"

          echo "Target:"
          echo "$TARGET"

          if command -v mka >/dev/null 2>&1; then

            echo ""
            echo "Using mka..."

            mka "$TARGET" -j4

          else

            echo ""
            echo "mka not found."
            echo "Using make..."

            make "$TARGET" -j4

          fi

          echo ""
          echo "========================================"
          echo "Recovery build finished"
          echo "========================================"

          echo ""
          echo "CCache statistics:"
          ccache --show-stats

          echo "::endgroup::"

        working-directory: ${{ steps.workspace.outputs.workspace-folder }}


      # =========================================================
      # VERIFY OUTPUT
      # =========================================================

      - name: Verify Build Output
        run: |

          set -e

          OUT="out/target/product/${{ github.event.inputs.DEVICE_NAME }}"

          echo ""
          echo "========================================"
          echo "Verifying Build Output"
          echo "========================================"

          echo "Output directory:"
          echo "$OUT"

          if [ ! -d "$OUT" ]; then
            echo ""
            echo "ERROR: Output directory does not exist."
            exit 1
          fi

          echo ""
          echo "Output contents:"
          ls -lah "$OUT"

          IMAGE="$OUT/${{ github.event.inputs.BUILD_TARGET }}.img"

          echo ""
          echo "Expected recovery image:"
          echo "$IMAGE"

          if [ ! -f "$IMAGE" ]; then

            echo ""
            echo "ERROR: Recovery image was NOT generated."

            echo ""
            echo "Searching for generated images..."

            find "$OUT" \
              -maxdepth 2 \
              -type f \
              \( -name "*.img" -o -name "*.zip" \) \
              -print

            exit 1

          fi

          echo ""
          echo "========================================"
          echo "SUCCESS"
          echo "========================================"

          echo ""
          echo "Recovery image:"
          ls -lh "$IMAGE"

          echo ""
          echo "SHA256:"
          sha256sum "$IMAGE"

        working-directory: ${{ steps.workspace.outputs.workspace-folder }}


      # ==================================================
# PREPARE RELEASE FILES
      # =========================================================

      - name: Prepare Release Files
        run: |

          set -e

          OUT="workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}"
          RELEASE_DIR="$GITHUB_WORKSPACE/release"

          mkdir -p "$RELEASE_DIR"

          echo ""
          echo "Preparing release files..."

          cp "$OUT/${{ github.event.inputs.BUILD_TARGET }}.img" \
             "$RELEASE_DIR/${{ github.event.inputs.DEVICE_NAME }}-${{ github.event.inputs.BUILD_TARGET }}.img"

          find "$OUT" -maxdepth 1 -type f -name "*.zip" -exec cp {} "$RELEASE_DIR/" \; || true

          find "$OUT" -maxdepth 1 -type f -name "*vendor*.img" -exec cp {} "$RELEASE_DIR/" \; || true

          echo ""
          echo "Release files:"

          ls -lah "$RELEASE_DIR"

        working-directory: ${{ github.event.inputs.DEVICE_PATH }}/../..


      # =========================================================
      # UPLOAD RELEASE
      # =========================================================

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:

          files: |
            release/*

          name: "${{ github.event.inputs.DEVICE_NAME }}-${{ github.run_id }}"

          tag_name: "${{ github.run_id }}"

          body: |
            # TWRP Recovery Build

            ## Device

            **Device:** ${{ github.event.inputs.DEVICE_NAME }}

            **Target:** ${{ github.event.inputs.BUILD_TARGET }}.img

            ## Manifest

            **Manifest branch:**
            ${{ github.event.inputs.MANIFEST_BRANCH }}

            **Manifest URL:**
            ${{ github.event.inputs.MANIFEST_URL }}

            ## Device Tree

            **Device tree:**
            ${{ github.event.inputs.DEVICE_TREE_URL }}

            **Branch:**
            ${{ github.event.inputs.DEVICE_TREE_BRANCH }}

            **Device path:**
            ${{ github.event.inputs.DEVICE_PATH }}

            ## Build

            **GitHub Run:** ${{ github.run_id }}

            **Commit:** ${{ github.sha }}

            Built automatically with GitHub Actions.

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

**One important correction:** in the `Prepare Release Files` step, you don't need a special `working-directory` at all. Remove that line if you paste the workflow exactly as above. The commands already use `$GITHUB_WORKSPACE` and the `workspace/...` path.

The key fix is the **`Fix Legacy Python 2 Build Script`** step. Your log shows the build reached `12% / 1878`, then died specifically when generating `android-info.txt`; this patch addresses that exact failure. The original Android script is Python 2-style, while Google's later version changed the `print` statements and build integration for Python 3.

If the next build gets past `android-info.txt`, **don't change anything yet**—send me the next failure log if another old TWRP/AOSP compatibility issue appears.